server {
    # 1. Cambiamos al puerto 8080 para el usuario NO ROOT
    listen 8080;
    server_name _;
    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;

    # Archivos estáticos (tu SPA sencilla)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy hacia el backend en la red interna de Docker
    location /api/ {
        # 2. Usamos el nombre del contenedor "backend" en lugar de la IP de AWS
        proxy_pass http://10.0.2.115:3001; 

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}